[package]
name = "relay"
version = "0.2.0"
edition = "2024"
description = "Portable Windows control panel for Telegram and zapret"
license = "MIT"

[dependencies]
tg-ws-proxy-rs = { git = "https://github.com/valnesfjord/tg-ws-proxy-rs.git", rev = "53f392280a370199ffe5c6ef0ac88808ed17c575" }
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
getrandom = "0.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Services", "Win32_System_Com", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_NetworkManagement_Dns"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
